name: Project checks

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Verify imports and Python syntax
        run: |
          python -c "import profi_order_monitor.monitor, playwright.async_api, certifi, dotenv"
          python -m compileall -q src examples tests
      - name: Verify shell syntax
        run: |
          bash -n scripts/setup.sh
          bash -n scripts/RUNNER.command
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Preview synthetic notification
        run: python examples/demo.py
